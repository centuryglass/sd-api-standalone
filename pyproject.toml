[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intrapaint_api"
version = "0.1.0"
description = "Standalone, headless Stable Diffusion backend client (ComfyUI / Forge / A1111 WebUI, ControlNet)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pillow",
    "requests",
    "platformdirs",
    "websocket-client",
    "pydantic",
    "typing-extensions",
]

[tool.setuptools.packages.find]
include = ["intrapaint_api*"]
