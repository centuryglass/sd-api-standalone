[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sd-backend-client"
version = "0.1.0"
description = "Standalone, headless Stable Diffusion backend client (ComfyUI / Forge / A1111 WebUI, ControlNet)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pillow",
    "requests",
    "websocket-client",
    "pydantic",
    "typing-extensions",
]

[tool.setuptools.packages.find]
include = ["sd_backend_client*"]

# PEP 561 marker: type checkers read the installed package's annotations only when it is in the wheel.
[tool.setuptools.package-data]
sd_backend_client = ["py.typed"]

# CI's typecheck job runs `mypy` with these settings (AGENTS.md, "Type checking").
[tool.mypy]
files = ["sd_backend_client"]
python_version = "3.11"
