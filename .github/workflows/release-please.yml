name: release-please

# Keeps a release pull request open against main, collecting the Conventional Commits titles of merged pull requests
# into CHANGELOG.md and bumping pyproject.toml's version (release-please-config.json). Merging it tags the release and
# publishes a GitHub release with that changelog section as its notes; the upload-artifacts job then attaches the sdist
# and wheel built from the tag to that release. While the version is below 1.0.0, a breaking change bumps the minor
# version (bump-minor-pre-major).
#
# Releases are not published to PyPI. Library users install from a release asset URL or a git URL.
#
# Pull requests opened with GITHUB_TOKEN don't trigger workflows, so CI has to be started by hand on the release pull
# request: run the ci workflow from the Actions tab on its branch. The repository setting "Allow GitHub Actions to
# create and approve pull requests" must be on for this workflow to open it.
on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          target-branch: main

  upload-artifacts:
    name: upload-artifacts
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      # Builds and checks the same way as ci.yml's package job, so a release ships what CI verified.
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          python -m build
          twine check --strict dist/*
          python scripts/check_dist.py dist

      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        # --clobber lets a re-run of this job replace assets from a failed earlier attempt.
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
