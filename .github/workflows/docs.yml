name: docs

# Builds the documentation site (mkdocs.yml) from main and publishes it to GitHub Pages at
# https://centuryglass.github.io/sd-backend-client/. The site tracks main, so it can describe changes that are not
# released yet. ci.yml's docs job builds the same site on pull requests.
#
# The repository's Pages source must be set to "GitHub Actions" (Settings > Pages > Build and deployment) for the
# deploy job to publish.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push waits rather than cancelling a deployment in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install documentation tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-docs.txt

      - name: Build the documentation site
        run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
