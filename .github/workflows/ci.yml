name: ci

# Runs the test suite and the lint check on every pull request into main and every push to it, so a change's state
# is known before it merges and main's state is known after. workflow_dispatch also allows running it by hand from the
# Actions tab, which release-please's pull requests need (see release-please.yml).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push supersedes the run in flight for the same branch or pull request.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is pyproject.toml's requires-python minimum; the newer ones guard against breakage as users upgrade.
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        # Installing the package also checks that pyproject.toml builds on this Python version.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt -e .

      - name: Run tests
        # No backend runs here, so the integration tests skip themselves and only tests/unit/ executes.
        run: python -m pytest tests/

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # scripts/pylint_baseline.json was generated with this version; pylint's inference can vary between them.
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: pylint (no new messages)
        run: python scripts/pylint_check.py

  # A single check to require for merging, so branch protection doesn't need updating whenever the matrix or the
  # set of jobs changes.
  ci:
    name: ci
    if: always()
    needs: [test, lint]
    runs-on: ubuntu-latest
    steps:
      - name: All checks passed
        if: needs.test.result != 'success' || needs.lint.result != 'success'
        run: |
          echo "test result: ${{ needs.test.result }}"
          echo "lint result: ${{ needs.lint.result }}"
          exit 1
